name: Tests

on:
  push:
    branches:
      - '*.x'
      - 'master'
  pull_request:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        laravel: [ '10.*', '11.*', '12.*', '13.*' ]
        phpunit: [ '10.*', '11.*', '12.*' ]
        service: [ '5.7', '8' ]
        dependency-version: [ prefer-lowest, prefer-stable ]
        exclude:
          # PHP 8.1 does not support Laravel 11, Laravel 12, or Laravel 13
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
          - php: '8.1'
            laravel: '13.*'
          
          # PHP 8.5 does not support Laravel 11
          - php: '8.5'
            laravel: '11.*'
          
          # PHP 8.2 does not support Laravel 13
          - php: '8.2'
            laravel: '13.*'

          # Laravel 10 does not support PHPUnit 10 or PHPUnit 12
          - laravel: '10.*'
            phpunit: '11.*'
          - laravel: '10.*'
            phpunit: '12.*'

          # Laravel 11 does not support PHPUnit 10 or PHPUnit 12
          - laravel: '11.*'
            phpunit: '11.*'
          - laravel: '11.*'
            phpunit: '12.*'

          # Laravel 12 does not support PHPUnit 10 or PHPUnit 12
          - laravel: '12.*'
            phpunit: '10.*'
          - laravel: '12.*'
            phpunit: '12.*'
            
          # Laravel 13 does not support PHPUnit 9 or PHPUnit 10 or PHPUnit 11
          - laravel: '13.*'
            phpunit: '10.*'
          - laravel: '13.*'
            phpunit: '11.*'

    name: 'Tests: PHP ${{ matrix.php }} / Laravel: ${{ matrix.laravel }} / ${{ matrix.dependency-version }} / MySQL ${{ matrix.service }}'

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # - name: Login to DockerHub
      #   uses: docker/login-action@v3
      #   if: ${{ env.DOCKERHUB_USERNAME != null && env.DOCKERHUB_TOKEN != null }}
      #   with:
      #     username: ${{ env.DOCKERHUB_USERNAME }}
      #     password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Replace .* in PHPUnit Matrix Version
        run: |
          PHPUNIT_VERSION=${{ matrix.phpunit }}
          CLEAN_PHPUNIT_VERSION=${PHPUNIT_VERSION//\*\./_}
          echo "CLEAN_PHPUNIT_VERSION=$CLEAN_PHPUNIT_VERSION" >> $GITHUB_ENV
      - name: Run tests
        run: ./test --php ${{ matrix.php }} --laravel ${{ matrix.laravel }} --db ${{ matrix.service }} --dependencies ${{ matrix.dependency-version }} --phpunit ${{ env.CLEAN_PHPUNIT_VERSION }}

  installation-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        laravel: [ '10.0', '11.0', '12.0', '13.0' ]
        exclude:
          # PHP 8.1 does not support Laravel 11 or Laravel 12 or Laravel 13
          - php: '8.1'
            laravel: '11.0'
          - php: '8.1'
            laravel: '12.0'
          - php: '8.1'
            laravel: '13.0'
            
          # PHP 8.2 does not support Laravel 13
          - php: '8.2'
            laravel: '13.0'
            
          # PHP 8.4 does not support Laravel 10
          - php: '8.4'
            laravel: '10.0'
              
          # PHP 8.5 does not support Laravel 10 or Laravel 11
          - php: '8.5'
            laravel: '10.0'
          - php: '8.5'
            laravel: '11.0'

    name: 'Installation: PHP ${{ matrix.php }} / Laravel: ${{ matrix.laravel }}'

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ./package

      - name: Install Laravel
        run: docker run --rm -v ${PWD}:/app composer:latest composer create-project laravel/laravel:^${{ matrix.laravel }} application

      - name: Add the package as a path repository
        run: |
          docker run --rm -v ${PWD}:/app --workdir /app/application composer:latest composer config repositories.0 path ../package

      - name: Require the package
        run: |
          docker run --rm -v ${PWD}:/app --workdir /app/application composer:latest composer require tenancy/tenancy:dev-main
